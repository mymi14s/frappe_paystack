[project]
name = "frappe_paystack"
authors = [
    { name = "Anthony Emmanuel", email = "mymi14s@hotmail.com"}
]
description = "Paystack integration for Frappe/ERPNext"
requires-python = ">=3.12"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<=17.0.0"
erpnext = ">=15.0.0,<=17.0.0"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.flake8]
max-line-length = 110
extend-ignore = ["W503", "E203"]
exclude = ["__pycache__", ".git", "*.egg-info", "build", "dist"]

[tool.pylint."messages control"]
disable = [
    "too-many-arguments",
    "too-many-locals",
    "too-many-branches",
    "too-many-statements",
    "missing-class-docstring",
    "missing-module-docstring",
    "protected-access",
    "broad-except",
    "import-outside-toplevel",
]

[tool.pylint.format]
max-line-length = 110

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["frappe.*", "erpnext.*", "requests.*"]
ignore_missing_imports = true
