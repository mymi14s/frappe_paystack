name: Linters

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linter:
    name: 'Frappe Linter'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # Runs .pre-commit-config.yaml.
      - uses: pre-commit/action@v3.0.0
        env:
          SKIP: no-commit-to-branch

  code-quality:
    name: 'Code Quality'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # Versions match the rev pins in .pre-commit-config.yaml.
      - name: Install tools
        id: install
        run: |
          pip install \
            isort==8.0.1 \
            black==26.5.1 \
            flake8==7.3.0 \
            pylint==4.0.6 \
            mypy==2.3.0

      # Each tool reports independently; the job fails if any step failed.
      - name: isort
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: isort --check-only --diff .

      - name: black
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: black --check --diff .

      - name: flake8
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: flake8 .

      # ignored-modules in pyproject.toml covers the bench packages.
      - name: pylint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pylint --rcfile=pyproject.toml frappe_paystack

      - name: mypy
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: mypy --config-file=pyproject.toml frappe_paystack

  semgrep:
    name: 'Semgrep Rules'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Download Semgrep rules
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules

      - name: Run Semgrep rules
        run: |
          pip install semgrep
          semgrep ci --config ./frappe-semgrep-rules/rules --config r/python.lang.correctness

  deps-vulnerable-check:
    name: 'Vulnerable Dependency Check'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install and run pip-audit
        run: |
          pip install pip-audit
          cd "${GITHUB_WORKSPACE}"
          pip-audit --desc on .
