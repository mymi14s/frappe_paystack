name: CI

on:
  # A branch with an open pull request is covered by the pull_request event.
  push:
    branches: [version-16]
  pull_request:
  workflow_dispatch:

concurrency:
  # github.event.number is empty on push; github.ref keeps the branches separate.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The coverage the report is measured with. .coveragerc is written for this line.
  # frappe pins coverage ~=7.10.0 on version-16; this version is forced over it.
  COVERAGE_VERSION: '7.15.2'

jobs:
  linter:
    name: 'Frappe Linter'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      # Runs .pre-commit-config.yaml.
      - uses: pre-commit/action@v3.0.0
        env:
          SKIP: no-commit-to-branch

  code-quality:
    name: 'Code Quality'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      # Versions match the rev pins in .pre-commit-config.yaml.
      - name: Install tools
        id: install
        run: |
          pip install \
            isort==8.0.1 \
            black==26.5.1 \
            flake8==7.3.0 \
            pylint==4.0.6 \
            mypy==2.3.0

      # Each tool reports independently; the job fails if any step failed.
      - name: isort
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: isort --check-only --diff .

      - name: black
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: black --check --diff .

      - name: flake8
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: flake8 .

      # ignored-modules in pyproject.toml covers the bench packages.
      - name: pylint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pylint --rcfile=pyproject.toml frappe_paystack

      - name: mypy
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: mypy --config-file=pyproject.toml frappe_paystack

  semgrep:
    name: 'Semgrep Rules'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Download Semgrep rules
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules

      - name: Run Semgrep rules
        run: |
          pip install semgrep
          semgrep ci --config ./frappe-semgrep-rules/rules --config r/python.lang.correctness

  deps-vulnerable-check:
    name: 'Vulnerable Dependency Check'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install and run pip-audit
        run: |
          pip install pip-audit
          cd "${GITHUB_WORKSPACE}"
          pip-audit --desc on .

  frontend:
    runs-on: ubuntu-latest
    name: Frontend
    timeout-minutes: 30
    # Skipped when either lint job fails or is cancelled.
    needs: [linter, code-quality]

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          cache: npm

      - name: Install
        run: npm ci

      - name: Run Vitest
        run: npm test

  tests:
    runs-on: ubuntu-latest
    name: Server (Python ${{ matrix.python }}, frappe ${{ matrix.frappe }})
    timeout-minutes: 90
    # The bench build and the server suite start only after both lint jobs pass.
    needs: [linter, code-quality]

    strategy:
      fail-fast: false
      matrix:
        # frappe version-16 declares requires-python >=3.14,<3.15, and so does
        # this app.
        include:
          - python: '3.14'
            frappe: version-16
            erpnext: version-16
            payments: version-16
            webshop: version-16

    # bench reads CI when it renders the Procfile.
    env:
      CI: 'Yes'
      FRAPPE_BRANCH: ${{ matrix.frappe }}
      ERPNEXT_BRANCH: ${{ matrix.erpnext }}
      PAYMENTS_BRANCH: ${{ matrix.payments }}
      WEBSHOP_BRANCH: ${{ matrix.webshop }}
      PYTHON_VERSION: ${{ matrix.python }}
      # bench get-app runs yarn install, which would download the Cypress binary.
      CYPRESS_INSTALL_BINARY: '0'

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Compiles on the interpreter the suite runs on, so it follows setup-python.
      - name: Check for merge conflicts and syntax errors
        run: |
          "${{ steps.setup-python.outputs.python-path }}" -m compileall -q -f "${GITHUB_WORKSPACE}/frappe_paystack"
          if grep -lr --exclude-dir=node_modules --exclude-dir=.git "^<<<<<<< " "${GITHUB_WORKSPACE}"; then
            echo "::error::Found merge conflict markers"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python }}-${{ matrix.frappe }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python }}-${{ matrix.frappe }}-pip-
            ${{ runner.os }}-py${{ matrix.python }}-${{ matrix.frappe }}-

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt-get install -y mariadb-client

      - name: Setup bench
        run: |
          pip install frappe-bench
          # setup-python reports the interpreter it installed; PATH lookups can find another.
          bench init \
            --skip-redis-config-generation \
            --skip-assets \
            --frappe-branch "${FRAPPE_BRANCH}" \
            --python "${{ steps.setup-python.outputs.python-path }}" \
            ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      # A venv built on another interpreter measures other code, so the run stops here.
      - name: Check the bench interpreter
        working-directory: /home/runner/frappe-bench
        run: |
          ./env/bin/python -VV
          FOUND="$(./env/bin/python -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
          echo "bench venv runs Python ${FOUND}, workflow asked for ${PYTHON_VERSION}"
          if [ "${FOUND}" != "${PYTHON_VERSION}" ]; then
            echo "::error::bench built its venv on Python ${FOUND}, not ${PYTHON_VERSION}"
            exit 1
          fi

      - name: Install apps
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app https://github.com/frappe/erpnext --branch "${ERPNEXT_BRANCH}" --resolve-deps
          # frappe_paystack imports payments.utils.
          bench get-app https://github.com/frappe/payments --branch "${PAYMENTS_BRANCH}"
          # The storefront the webshop and portal suites run against.
          bench get-app https://github.com/frappe/webshop --branch "${WEBSHOP_BRANCH}"
          # actions/checkout leaves a detached HEAD; the branch names the commit.
          git -C "${GITHUB_WORKSPACE}" checkout -B ci-run
          # Installs the checked-out revision.
          bench get-app frappe_paystack "${GITHUB_WORKSPACE}" --branch ci-run
          bench setup requirements --dev
          # frappe's dev dependencies pin coverage below this line on both branches,
          # and their branch analysis differs; this wins.
          ./env/bin/pip install --upgrade "coverage==${COVERAGE_VERSION}"
          FOUND="$(./env/bin/python -c 'import coverage; print(coverage.__version__)')"
          echo "bench venv runs coverage ${FOUND}"
          if [ "${FOUND}" != "${COVERAGE_VERSION}" ]; then
            echo "::error::coverage ${FOUND} is installed, not ${COVERAGE_VERSION}"
            exit 1
          fi

      - name: Create site
        working-directory: /home/runner/frappe-bench
        run: |
          bench new-site --set-default --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext
          bench --site test_site install-app payments
          bench --site test_site install-app webshop
          bench --site test_site install-app frappe_paystack
          bench --site test_site set-config allow_tests true
          bench build

      # bench run-tests exits 0 when tests fail, so the wrapper reads the summary line.
      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bash apps/frappe_paystack/.github/scripts/run-tests-with-coverage.sh \
            /home/runner/frappe-bench test_site
        env:
          TYPE: server

      - name: Show bench output
        if: ${{ always() }}
        run: |
          cat /home/runner/frappe-bench/logs/*.log || true
