name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  # github.event.number is empty on push; github.ref keeps the branches separate.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The coverage the report is measured with. .coveragerc is written for this line.
  # frappe pins coverage ~=6.5.0 on version-15 and ~=7.10.0 on version-16, and both
  # legs force this version over the pin.
  COVERAGE_VERSION: '7.15.2'

jobs:
  frontend:
    runs-on: ubuntu-latest
    name: Frontend
    timeout-minutes: 30

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          cache: npm

      - name: Install
        run: npm ci

      - name: Run Vitest
        run: npm test

  tests:
    runs-on: ubuntu-latest
    name: Server (Python ${{ matrix.python }}, frappe ${{ matrix.frappe }})
    timeout-minutes: 90

    strategy:
      # Each pair reports on its own; one red leg leaves the other running.
      fail-fast: false
      matrix:
        # The interpreter is paired with the framework branch, not crossed with it.
        # frappe version-15 declares requires-python >=3.10,<3.15; frappe
        # version-16 declares >=3.14,<3.15.
        include:
          - python: '3.12'
            frappe: version-15
            erpnext: version-15
            payments: version-15
            webshop: version-15
            # The Cypress specs drive the version-15 POS UI, and version-15 is the
            # release this app ships against, so the UI suite runs on this leg.
            ui: true
          - python: '3.14'
            frappe: version-16
            erpnext: version-16
            payments: version-16
            webshop: version-16
            ui: false

    # bench reads CI when it renders the Procfile.
    env:
      CI: 'Yes'
      FRAPPE_BRANCH: ${{ matrix.frappe }}
      ERPNEXT_BRANCH: ${{ matrix.erpnext }}
      PAYMENTS_BRANCH: ${{ matrix.payments }}
      WEBSHOP_BRANCH: ${{ matrix.webshop }}
      PYTHON_VERSION: ${{ matrix.python }}

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Compiles on the interpreter the suite runs on, so it follows setup-python.
      - name: Check for merge conflicts and syntax errors
        run: |
          "${{ steps.setup-python.outputs.python-path }}" -m compileall -q -f "${GITHUB_WORKSPACE}/frappe_paystack"
          if grep -lr --exclude-dir=node_modules --exclude-dir=.git "^<<<<<<< " "${GITHUB_WORKSPACE}"; then
            echo "::error::Found merge conflict markers"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          # The interpreter and the framework branch are in the key, so the two legs
          # keep separate caches.
          key: ${{ runner.os }}-py${{ matrix.python }}-${{ matrix.frappe }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python }}-${{ matrix.frappe }}-pip-
            ${{ runner.os }}-py${{ matrix.python }}-${{ matrix.frappe }}-

      - name: Cache Cypress binary
        if: ${{ matrix.ui }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-cypress-

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt-get install -y mariadb-client

      - name: Setup bench
        run: |
          pip install frappe-bench
          # setup-python reports the interpreter it installed; PATH lookups can find another.
          bench init \
            --skip-redis-config-generation \
            --skip-assets \
            --frappe-branch "${FRAPPE_BRANCH}" \
            --python "${{ steps.setup-python.outputs.python-path }}" \
            ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      # A venv built on another interpreter measures other code, so the run stops here.
      - name: Check the bench interpreter
        working-directory: /home/runner/frappe-bench
        run: |
          ./env/bin/python -VV
          FOUND="$(./env/bin/python -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
          echo "bench venv runs Python ${FOUND}, workflow asked for ${PYTHON_VERSION}"
          if [ "${FOUND}" != "${PYTHON_VERSION}" ]; then
            echo "::error::bench built its venv on Python ${FOUND}, not ${PYTHON_VERSION}"
            exit 1
          fi

      - name: Install apps
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app https://github.com/frappe/erpnext --branch "${ERPNEXT_BRANCH}" --resolve-deps
          # frappe_paystack imports payments.utils.
          bench get-app https://github.com/frappe/payments --branch "${PAYMENTS_BRANCH}"
          # The storefront the webshop and portal suites run against.
          bench get-app https://github.com/frappe/webshop --branch "${WEBSHOP_BRANCH}"
          # actions/checkout leaves a detached HEAD; the branch names the commit.
          git -C "${GITHUB_WORKSPACE}" checkout -B ci-run
          # Installs the checked-out revision.
          bench get-app frappe_paystack "${GITHUB_WORKSPACE}" --branch ci-run
          bench setup requirements --dev
          # frappe's dev dependencies pin coverage below this line on both branches,
          # and their branch analysis differs; this wins.
          ./env/bin/pip install --upgrade "coverage==${COVERAGE_VERSION}"
          FOUND="$(./env/bin/python -c 'import coverage; print(coverage.__version__)')"
          echo "bench venv runs coverage ${FOUND}"
          if [ "${FOUND}" != "${COVERAGE_VERSION}" ]; then
            echo "::error::coverage ${FOUND} is installed, not ${COVERAGE_VERSION}"
            exit 1
          fi

      - name: Create site
        working-directory: /home/runner/frappe-bench
        run: |
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext
          bench --site test_site install-app payments
          bench --site test_site install-app webshop
          bench --site test_site install-app frappe_paystack
          bench --site test_site set-config allow_tests true
          bench build

      # bench run-tests exits 0 when tests fail, so the wrapper reads the summary line.
      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bash apps/frappe_paystack/.github/scripts/run-tests-with-coverage.sh \
            /home/runner/frappe-bench test_site
        env:
          TYPE: server

      # The Cypress specs reuse the bench the server tests just built.
      - name: Set up the site for UI tests
        if: ${{ matrix.ui }}
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site execute frappe.utils.install.complete_setup_wizard
          bench --site test_site execute frappe.utils.scheduler.disable_scheduler
          bench --site test_site execute frappe_paystack.tests.ui_test_helpers.create_pos_test_user

      - name: Start the bench
        if: ${{ matrix.ui }}
        working-directory: /home/runner/frappe-bench
        run: |
          bench start &> bench_start.log &
          timeout 180 bash -c 'until curl -sf http://localhost:8000/api/method/frappe.ping > /dev/null; do sleep 2; done'

      # Runs the cypress in package.json against cypress.config.js in this checkout.
      - name: Install Cypress
        if: ${{ matrix.ui }}
        run: |
          npm ci
          npx cypress install
          npx cypress verify

      - name: Run UI Tests
        if: ${{ matrix.ui }}
        run: npx cypress run --browser chrome
        env:
          CYPRESS_baseUrl: http://localhost:8000
          CYPRESS_adminPassword: admin

      - name: Upload Cypress artifacts
        if: ${{ matrix.ui && failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts-${{ matrix.frappe }}
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore

      - name: Show bench output
        if: ${{ always() }}
        run: |
          cat /home/runner/frappe-bench/bench_start.log || true
          cat /home/runner/frappe-bench/logs/*.log || true
